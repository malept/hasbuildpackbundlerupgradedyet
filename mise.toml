[alias]
cargo-shear = "github:Boshen/cargo-shear"

[tools]
actionlint = "latest"
python = "3.13"
ruff = "latest"
rust = { version = "stable", profile = "default" }
uv = "latest"

[task_config]
includes = [
  ".tasks/_default.toml",
  ".tasks/python.toml",
  ".tasks/rust.toml",
  ".tasks/toml.toml",
]
